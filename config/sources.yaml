# RSS sources. topic is a coarse label written into the public dataset.
# cap = max items taken per source per run (newest first).
# Edit freely — fetch.py tolerates dead feeds and just logs a warning.

window_hours: 36          # only items published within this window are considered
max_candidates: 140       # hard cap on fetch pool (all rows land in data/)

# LLM ranking pool: stratified sample from fetch pool (title-only prompt).
# 美股偏厚：PhD 是 SPX 长期期权；加密是个人量化，不是研究主场。
llm_pool_size: 60
llm_pool_quotas:
  us_stocks: 26   # macro, markets, finance, options, china
  tech: 14
  crypto: 12

sources:
  # ---- 金融 / 宏观 / 期权 (8) ----
  - name: Fed Press Releases
    url: https://www.federalreserve.gov/feeds/press_all.xml
    topic: macro
    cap: 8
  - name: WSJ Markets
    url: https://feeds.content.dowjones.io/public/rss/RSSMarketsMain
    topic: markets
    cap: 12
  - name: CNBC Markets
    url: https://www.cnbc.com/id/20910258/device/rss/rss.html
    topic: markets
    cap: 12
  - name: FT Home
    url: https://www.ft.com/rss/home
    topic: finance
    cap: 12
  - name: Google News Business
    url: https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-US&gl=US&ceid=US:en
    topic: finance
    cap: 8
  - name: Calculated Risk
    url: https://www.calculatedriskblog.com/feeds/posts/default
    topic: macro
    cap: 6
  - name: MarketWatch Pulse
    url: https://feeds.marketwatch.com/marketwatch/marketpulse/
    topic: markets
    cap: 10
  - name: Google News SPX Options
    url: https://news.google.com/rss/search?q=SPX+OR+VIX+OR+%22S%26P+500%22+options+when:2d&hl=en-US&gl=US&ceid=US:en
    topic: options
    cap: 8

  # ---- 前沿科技 (4) ----
  - name: Hacker News Frontpage
    url: https://hnrss.org/frontpage
    topic: tech
    cap: 15
  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
    topic: tech
    cap: 8
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    topic: tech
    cap: 10
  - name: arXiv cs.AI
    url: https://rss.arxiv.org/rss/cs.AI
    topic: research
    cap: 8

  # ---- Crypto 头部 (2) ----
  - name: The Block
    url: https://www.theblock.co/rss.xml
    topic: crypto
    cap: 8
  - name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    topic: crypto
    cap: 8

  # ---- 国内 (1) ----
  - name: Google News 中文财经
    url: https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=zh-CN&gl=CN&ceid=CN:zh-Hans
    topic: china
    cap: 6
