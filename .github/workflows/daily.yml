name: daily-brief

on:
  schedule:
    # 目标07:30布里斯班(AEST=UTC+10)。GitHub cron在整点/半点拥挤时段延迟可达1h+,
    # 故提前并选冷门分钟: 20:47 UTC + 实际延迟 ≈ 07:00-07:45 AEST
    - cron: "47 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read   # GitHub Models 免费额度 (GITHUB_TOKEN 认证)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 20 deprecated on runners 2026-06-16

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Fetch sources
        run: python src/fetch.py

      - name: Rank with LLM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDERS: github-models,claude
          GITHUB_MODELS_MODEL: openai/gpt-4.1
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENDA: ${{ secrets.AGENDA }}
          CLAUDE_MODEL: claude-opus-4-6
        run: python src/brief.py

      - name: Push briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_KEYWORD: ${{ secrets.FEISHU_KEYWORD }}
        run: python src/push.py

      - name: Commit dataset + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) run"
          # 运行期间远端可能有新提交(手动push撞上cron) — 先rebase再推
          git pull --rebase origin main
          git push

      # 反静默死亡: 任何一步挂了都要在每天必看的渠道里留下尸检入口
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_KEYWORD: ${{ secrets.FEISHU_KEYWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="⚠️ Horizon Brief ${FEISHU_KEYWORD} 今日运行失败，点开看日志: ${RUN_URL}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}" || true
          fi
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            curl -sf -X POST "$FEISHU_WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"${MSG}\"}}" || true
          fi
